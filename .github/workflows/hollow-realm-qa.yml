name: Hollow Realm QA

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hollow-realm-visuals, feature/server-authoritative-persistence]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/tanstack-start-cve

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched TanStack Start"
          git push origin HEAD:fix/tanstack-start-cve
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Production-style Vite build
        run: npm run build:dev

      - name: Game rules and shell unit tests
        run: npm run test:game

      - name: Long-campaign simulation
        env:
          HOLLOW_SIM_RUNS: 2500
        run: node scripts/hollow-realm-sim.mjs

      - name: Boss matchup simulation
        run: node --import ./scripts/register-ts-ext.mjs scripts/combat-balance-sim.mjs 400

      - name: Install Chromium for mobile smoke
        run: npx playwright install --with-deps chromium

      - name: Globe terrain bake parity
        run: node scripts/globe-bake-qa.mjs

      - name: Start Hollow Realm
        env:
          TYRONE_SYNC_WRITE_KEY: hollow-qa-sync-key
        run: |
          npm run dev > /tmp/hollow-realm.log 2>&1 &
          echo $! > /tmp/hollow-realm.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hollow-realm.log
          exit 1

      - name: Discord access gate smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-discord-access-smoke.mjs

      - name: Main-menu procedural terminal smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-main-menu-terminal-smoke.mjs

      - name: Server authority security smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
          TYRONE_SYNC_WRITE_KEY: hollow-qa-sync-key
        run: node scripts/hollow-authority-smoke.mjs

      - name: Server Inventory authority attack smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-inventory-authority-smoke.mjs

      - name: Server acquisition authority smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-acquisition-authority-smoke.mjs

      - name: Server mission performance authority smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-performance-authority-smoke.mjs

      - name: Live browser Inventory authority smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-server-inventory-browser-smoke.mjs

      - name: Mobile interaction and dismissal smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-ux-smoke.mjs

      - name: iPhone-shaped gameplay smoke
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-realm-smoke.mjs

      - name: Hub/Task chrome budget
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hub-task-chrome-qa.mjs

      - name: Inventory touch scrolling
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/inventory-touch-qa.mjs

      - name: UX pass surfaces
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/hollow-ux-passes-qa.mjs

      - name: Boss fight reads
        env:
          HOLLOW_QA_URL: http://127.0.0.1:8080
        run: node scripts/boss-fight-qa.mjs

      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-realm-ux-qa
          path: screenshots
          if-no-files-found: ignore

      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-realm-iphone-qa
          path: artifacts/hollow-realm-iphone-smoke.png
          if-no-files-found: ignore

      - name: Print dev server log on failure
        if: failure()
        run: cat /tmp/hollow-realm.log || true
