<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Water Balloon Shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Saira+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed ray-traced viewport, an instrument rack docked right, a transport strip along the bottom edge */
:root{
  --bg:#07090b;
  --panel:rgba(12,15,18,.9);
  --line:#222930;
  --fg:#d6dce1;
  --muted:#7c8791;
  --accent:#f0a646;       /* trigger-lamp amber */
  --accent-2:#71c2dc;     /* water */
  --f-ui:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button,[role="button"]{cursor:pointer}
#stage{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#000}
#view:active{cursor:grabbing}

#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;pointer-events:none;display:grid;gap:6px;max-width:min(360px,calc(100vw - 32px))}
#hud h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fg)}
#hud .sub{font-size:12px;color:var(--muted);letter-spacing:.04em}
#readouts{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-family:var(--f-num);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
#readouts b{color:var(--fg);font-weight:500}
#phase{font-family:var(--f-num);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#bake{font-family:var(--f-num);font-size:10px;color:var(--accent-2)}

#views{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:332px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.chip{background:rgba(12,15,18,.72);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font-size:12px;letter-spacing:.05em;color:var(--fg)}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#panel{position:absolute;top:0;right:0;bottom:0;width:316px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 90px);backdrop-filter:blur(8px)}
#panel h2{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
#panel h2::after{content:"";flex:1;height:1px;background:var(--line)}
#panel h2:first-child{margin-top:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:9px;align-items:baseline}
.row label{font-size:13px;color:var(--fg)}
.row output{font-family:var(--f-num);font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
.row select{grid-column:1/-1;background:#0e1215;border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fg);border:0}
.rebake label::after{content:" ↻";color:var(--muted);font-size:11px}

#transport{position:absolute;left:0;right:316px;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,rgba(7,9,11,.92),rgba(7,9,11,.55) 70%,transparent);display:grid;grid-template-columns:auto auto auto 1fr auto auto;gap:10px;align-items:center}
.tbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(12,15,18,.8);display:grid;place-items:center;padding:0}
.tbtn svg{width:14px;height:14px;fill:var(--fg)}
#play{border-color:var(--accent)}
#play svg{fill:var(--accent)}
#tlwrap{position:relative;min-width:0}
#timeline{width:100%}
#ticks{position:relative;height:14px;font-family:var(--f-num);font-size:9px;color:var(--muted)}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#marks{position:absolute;left:0;right:0;top:0;height:18px;pointer-events:none}
#marks i{position:absolute;top:3px;width:2px;height:12px;background:var(--accent-2);transform:translateX(-1px);opacity:.8}
#tread{font-family:var(--f-num);font-size:13px;min-width:112px;text-align:right;font-variant-numeric:tabular-nums}
#speed{background:#0e1215;border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-size:12px}
#panelToggle{display:none}
body.clean #hud,body.clean #views,body.clean #panel,body.clean #transport{display:none}
#err{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:var(--fg);background:var(--bg)}

@media (max-width:760px){
  #panel{top:auto;height:58%;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
  body.panel-open #panel{transform:none}
  #transport{right:0;grid-template-columns:auto auto auto 1fr;grid-template-areas:"p b f r" "t t t t" "s s g g"}
  #play{grid-area:p}#back{grid-area:b}#fwd{grid-area:f}#tread{grid-area:r}#tlwrap{grid-area:t}#speed{grid-area:s}#panelToggle{grid-area:g;display:block}
  #views{right:16px;top:auto;bottom:150px;max-width:calc(100vw - 32px)}
  #readouts{font-size:10px}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" aria-label="Ray-traced view of the water balloon. Drag to orbit, scroll or pinch to zoom, right-drag to pan."></canvas>

  <div id="hud">
    <h1>Water Balloon Shot</h1>
    <div class="sub" id="shotline">9 mm FMJ · 370 m/s · 16 cm balloon</div>
    <div id="phase">Bullet approaching</div>
    <div id="readouts">
      <span>Time</span><b id="rT">−0.400 ms</b>
      <span>Bullet</span><b id="rU">370 m/s</b>
      <span>Energy into water</span><b id="rE">0 J</b>
      <span>Water speed (max)</span><b id="rV">0 m/s</b>
    </div>
    <div id="bake">Simulating…</div>
  </div>

  <div id="views" role="group" aria-label="Camera views">
    <button class="chip" data-view="side">Side</button>
    <button class="chip" data-view="three">¾</button>
    <button class="chip" data-view="front">Muzzle</button>
    <button class="chip" data-view="exit">Exit</button>
    <button class="chip" data-view="top">Top</button>
    <button class="chip" data-view="wide">Wide</button>
  </div>

  <aside id="panel" aria-label="Simulation settings"></aside>

  <div id="transport">
    <button class="tbtn" id="play" aria-label="Play or pause (Space)"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2l10 6-10 6z"/></svg></button>
    <button class="tbtn" id="back" aria-label="Step back one frame"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2L6 8l8 6z"/></svg></button>
    <button class="tbtn" id="fwd" aria-label="Step forward one frame"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2l8 6-8 6z"/></svg></button>
    <div id="tlwrap">
      <div id="marks"></div>
      <input type="range" id="timeline" min="0" max="10000" step="1" value="0" aria-label="Timeline (log scale)">
      <div id="ticks"></div>
    </div>
    <div id="tread">−0.400 ms</div>
    <select id="speed" aria-label="Playback speed">
      <option value="ramp" selected>Speed ramp</option>
      <option value="0.00002">1/50 000×</option>
      <option value="0.0001">1/10 000×</option>
      <option value="0.001">1/1 000×</option>
      <option value="0.01">1/100×</option>
      <option value="0.1">1/10×</option>
      <option value="1">Real time</option>
    </select>
    <button class="chip" id="panelToggle">Settings</button>
  </div>
  <div id="err"></div>
</div>

<!-- ============================ SIMULATION WORKER ============================ -->
<script type="text/plain" id="simsrc">
'use strict';
const TAU = Math.PI * 2, Q = 4096, SENT = -32768, THN = 0.36;
let P, rand, R, CX, CY, CZ, s, h, h2, rp, N, S;
let x, y, z, vx, vy, vz, px, py, pz, lam, lam2, dpx, dpy, dpz, nb, nbc, hit, aer, contact;
let head, nxt, TS;
let poly6K, spikyK, eps, rho0;
let B; // bullet
let trTab; const TRT = 64, TRP = 128;
let mem;
let sx, sy, sz, svx, svy, svz, scx, scy, scz, srad, skind, sbirth, stau, salive, sCount = 0;
let budget, used;
let wetT, wetUpd = [];
const WET = 256, WETE = 2.56;
let emitCarry = { entry: 0, exit: 0 };
let maxWaterSpeed = 0;

function mkRand(seed) { let st = (seed >>> 0) || 0x9e3779b9; return () => { st ^= st << 13; st >>>= 0; st ^= st >>> 17; st ^= st << 5; st >>>= 0; return st / 4294967296; }; }
function gauss() { let u = rand(); if (u < 1e-12) u = 1e-12; return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rand()); }
function h3(a, b, c) { let q = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(c, 1274126177); q = Math.imul(q ^ (q >>> 13), 1274126177); return ((q ^ (q >>> 16)) >>> 0) / 4294967296; }
function noise3(X, Y, Z) {
  const xi = Math.floor(X), yi = Math.floor(Y), zi = Math.floor(Z);
  let fx = X - xi, fy = Y - yi, fz = Z - zi; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = h3(xi, yi, zi), b = h3(xi + 1, yi, zi), c = h3(xi, yi + 1, zi), d = h3(xi + 1, yi + 1, zi);
  const e = h3(xi, yi, zi + 1), f = h3(xi + 1, yi, zi + 1), g = h3(xi, yi + 1, zi + 1), k = h3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * fx, x2 = c + (d - c) * fx, x3 = e + (f - e) * fx, x4 = g + (k - g) * fx;
  const y1 = x1 + (x2 - x1) * fy, y2 = x3 + (x4 - x3) * fy; return y1 + (y2 - y1) * fz;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// Hanging water balloon: slightly pear-shaped, heavier at the bottom.
function shapeR(dy) { return R * (1 - 0.07 * dy - 0.03 * dy * dy); }

// Rest surface point of the rubber for a unit direction (body + neck + knot).
function surfPoint(dx, dy, dz, out) {
  const th = Math.acos(clamp(dy, -1, 1));
  if (th >= THN) { const r = shapeR(dy); out[0] = CX + dx * r; out[1] = CY + dy * r; out[2] = CZ + dz * r; return; }
  const hl = Math.hypot(dx, dz); const hx = hl > 1e-6 ? dx / hl : 1, hz = hl > 1e-6 ? dz / hl : 0;
  const rn = shapeR(Math.cos(THN)); const rhoB = Math.sin(THN) * rn, yB = CY + Math.cos(THN) * rn;
  const u = th / THN; let rho;
  if (u > 0.42) { const k = smooth(0.42, 1, u); rho = 0.085 * R + (rhoB - 0.085 * R) * Math.pow(k, 1.6); }
  else { const w = u / 0.42; rho = R * (0.085 + 0.07 * Math.sin(Math.PI * w)) * Math.sqrt(w); }
  const yy = yB + (1 - u) * 0.5 * R;
  out[0] = CX + hx * rho; out[1] = yy; out[2] = CZ + hz * rho;
}

function insideBody(X, Y, Z, margin) {
  const dx = X - CX, dy = Y - CY, dz = Z - CZ; const r = Math.hypot(dx, dy, dz); if (r < 1e-9) return true;
  const cy = dy / r; if (Math.acos(clamp(cy, -1, 1)) < THN * 1.08) return false;
  return r < shapeR(cy) - margin;
}

function icosphere(level) {
  const t = (1 + Math.sqrt(5)) / 2; let verts = [];
  const add = (a, b, c) => { const l = Math.hypot(a, b, c); verts.push(a / l, b / l, c / l); return verts.length / 3 - 1; };
  [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].forEach(v => add(v[0], v[1], v[2]));
  let faces = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
  for (let l = 0; l < level; l++) {
    const cache = new Map(); const nf = [];
    const mid = (a, b) => { const key = a < b ? a * 100000 + b : b * 100000 + a; let m = cache.get(key); if (m === undefined) { m = add(verts[a * 3] + verts[b * 3], verts[a * 3 + 1] + verts[b * 3 + 1], verts[a * 3 + 2] + verts[b * 3 + 2]); cache.set(key, m); } return m; };
    for (const [a, b, c] of faces) { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a); nf.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); }
    faces = nf;
  }
  const idx = new Uint16Array(faces.length * 3);
  faces.forEach((f, i) => {
    const [a, b, c] = f; const ax = verts[a * 3], ay = verts[a * 3 + 1], az = verts[a * 3 + 2];
    const e1 = [verts[b * 3] - ax, verts[b * 3 + 1] - ay, verts[b * 3 + 2] - az], e2 = [verts[c * 3] - ax, verts[c * 3 + 1] - ay, verts[c * 3 + 2] - az];
    const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    const outward = n[0] * ax + n[1] * ay + n[2] * az > 0;
    idx[i * 3] = a; idx[i * 3 + 1] = outward ? b : c; idx[i * 3 + 2] = outward ? c : b;
  });
  return { dirs: new Float32Array(verts), idx };
}

// ---------- bullet (quadratic drag in water: dU/dt = -k U^2) ----------
function bulletX(t) { if (t <= 0) return B.xe + B.U0 * t; if (t <= B.tx) return B.xe + Math.log(1 + B.k * B.U0 * t) / B.k; return B.xx + B.U1 * (t - B.tx); }
function bulletU(t) { if (t <= 0) return B.U0; if (t <= B.tx) return B.U0 / (1 + B.k * B.U0 * t); return B.U1; }

// ---------- rubber tear front ----------
function basisFor(d) { const a = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]; let u = [a[1] * d[2] - a[2] * d[1], a[2] * d[0] - a[0] * d[2], a[0] * d[1] - a[1] * d[0]]; const l = Math.hypot(...u); u = u.map(v => v / l); const w = [d[1] * u[2] - d[2] * u[1], d[2] * u[0] - d[0] * u[2], d[0] * u[1] - d[1] * u[0]]; return [u, w]; }
function tearFrom(dx, dy, dz, pd, bas, t0, f, phase) {
  const c = clamp(dx * pd[0] + dy * pd[1] + dz * pd[2], -1, 1); const ang = Math.acos(c);
  const az = Math.atan2(dx * bas[1][0] + dy * bas[1][1] + dz * bas[1][2], dx * bas[0][0] + dy * bas[0][1] + dz * bas[0][2]);
  const crack = 0.45 + 0.9 * Math.pow(Math.abs(Math.sin(az * 3.5 + phase)), 0.55); // radial crack lines run ahead of the front
  const n = 0.75 + 0.5 * noise3(dx * 5 + 3.1, dy * 5 + 7.7, dz * 5 + 1.3);
  return t0 + ang * R / B.cTear * (ang < 0.12 ? 1 : crack) * n * f;
}
function tearTime(dx, dy, dz) {
  if (Math.acos(clamp(dy, -1, 1)) < THN * 1.1) return Infinity; // knot and neck are thick; tear stops there
  return Math.min(tearFrom(dx, dy, dz, B.de, B.be, 0, 1.0, 0.4), tearFrom(dx, dy, dz, B.dx, B.bx, B.tx, 0.8, 1.9));
}

// ---------- setup ----------
function setup(p) {
  P = p; rand = mkRand(p.seed || 7);
  R = p.radius; CX = 0; CY = p.height; CZ = 0;
  // lattice spacing to hit the requested particle count
  let sp = Math.cbrt(4.18879 * R * R * R / p.particles);
  const countAt = (spc) => { let c = 0; const n = Math.ceil(1.15 * R / spc); for (let i = -n; i <= n; i++) for (let j = -n - 2; j <= n + 2; j++) for (let k = -n; k <= n; k++) if (insideBody(CX + (i + 0.5 * (j & 1)) * spc, CY + j * spc * 0.87, CZ + (k + 0.5 * (j & 1)) * spc, 0.72 * spc)) c++; return c; };
  for (let it = 0; it < 6; it++) { const c = countAt(sp); sp *= Math.cbrt(c / p.particles); }
  s = sp; h = 2.0 * s; h2 = h * h; rp = 0.7 * s;
  const pts = []; const n = Math.ceil(1.15 * R / s);
  for (let i = -n; i <= n; i++) for (let j = -n - 2; j <= n + 2; j++) for (let k = -n; k <= n; k++) {
    const X = CX + (i + 0.5 * (j & 1)) * s + (rand() - 0.5) * 0.06 * s, Y = CY + j * s * 0.87 + (rand() - 0.5) * 0.06 * s, Z = CZ + (k + 0.5 * (j & 1)) * s + (rand() - 0.5) * 0.06 * s;
    if (insideBody(X, Y, Z, 0.72 * s)) pts.push(X, Y, Z);
  }
  N = pts.length / 3;
  const F = () => new Float32Array(N);
  x = F(); y = F(); z = F(); vx = F(); vy = F(); vz = F(); px = F(); py = F(); pz = F(); lam = F(); lam2 = F(); dpx = F(); dpy = F(); dpz = F(); aer = F();
  hit = new Uint8Array(N); contact = new Uint8Array(N); nbc = new Uint16Array(N); nb = new Int32Array(N * 64);
  for (let i = 0; i < N; i++) { x[i] = px[i] = pts[i * 3]; y[i] = py[i] = pts[i * 3 + 1]; z[i] = pz[i] = pts[i * 3 + 2]; }
  TS = 1; while (TS < N * 2) TS <<= 1; head = new Int32Array(TS); nxt = new Int32Array(N);
  poly6K = 315 / (64 * Math.PI * Math.pow(h, 9)); spikyK = 45 / (Math.PI * Math.pow(h, 6));
  // rest density & constraint softness measured from the initial lattice
  buildGrid(); findNeighbors();
  let maxc = 0; for (let i = 0; i < N; i++) maxc = Math.max(maxc, nbc[i]);
  let rs = 0, rc = 0, gs = 0;
  for (let i = 0; i < N; i++) {
    if (nbc[i] < 0.9 * maxc) continue; let rho = poly6K * h2 * h2 * h2, g2 = 0, gx = 0, gy = 0, gz = 0;
    for (let q = 0; q < nbc[i]; q++) { const j = nb[i * 64 + q]; const dx = px[i] - px[j], dy = py[i] - py[j], dz = pz[i] - pz[j]; const r2 = dx * dx + dy * dy + dz * dz; const r = Math.sqrt(r2); const w = h2 - r2; rho += poly6K * w * w * w; if (r > 1e-9) { const gg = spikyK * (h - r) * (h - r) / r; g2 += gg * gg * r2; gx += gg * dx; gy += gg * dy; gz += gg * dz; } }
    rs += rho; rc++; gs += g2 + gx * gx + gy * gy + gz * gz;
  }
  rho0 = rs / rc; const gTyp = gs / rc / (rho0 * rho0); eps = 0.06 * gTyp;
  poly6K /= rho0; spikyK /= rho0; // work with normalised density
  // bullet
  const a = p.caliber / 2, yb = CY + p.offset * R;
  const bnd = (dir) => { let lo = 0, hi = 1.6 * R * dir; for (let it = 0; it < 40; it++) { const m = (lo + hi) / 2; if (insideBody(CX + m, yb, CZ, 0) || Math.abs(m) < 1e-6) lo = m; else hi = m; } return (lo + hi) / 2; };
  const xe = bnd(-1), xx = bnd(1);

  target(G.b1); bindTex(p, 'uTex', G.b0.tex[0], 0); quad();
  target(G.b2); bindTex(p, 'uTex', G.b1.tex[0], 0); quad();
  target(G.b3); bindTex(p, 'uTex', G.b2.tex[0], 0); quad();
  p = P.up; gl.useProgram(p); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (const [dst, s2] of [[G.b2, G.b3], [G.b1, G.b2], [G.b0, G.b1]]) { target(dst); bindTex(p, 'uTex', s2.tex[0], 0); gl.uniform2f(p.u('uOut'), dst.w, dst.h); quad(); }
  gl.disable(gl.BLEND);

  // 10. depth of field, tone mapping
  target(null); p = P.fin; gl.useProgram(p);
  bindTex(p, 'uHdr', G.comp.tex[0], 0); bindTex(p, 'uZ', G.comp.tex[1], 1); bindTex(p, 'uBloom', G.b0.tex[0], 2);
  const focus = Math.hypot(...sub(cam.target, cb.pos));
  const fWorld = 0.036 / (2 * Math.tan(fov / 2) * (W / H > 1 ? W / H : 1)) * (W / H > 1 ? 1 : 1);
  const focal = 0.024 / (2 * tanH); // 24 mm-tall sensor
  const cocK = (focal / S.fstop) * fpx * 1; // coc_px = A*fpx*|z-zf|/(z*zf)
  gl.uniform2f(p.u('uRes'), W, H); gl.uniform1f(p.u('uExp'), Math.pow(2, S.exposure)); gl.uniform1f(p.u('uFocus'), focus); gl.uniform1f(p.u('uCocK'), cocK * (fWorld > 0 ? 1 : 1));
  gl.uniform1f(p.u('uGrain'), 0.018); gl.uniform1f(p.u('uSeed'), (t * 1e5) % 97); gl.uniform1f(p.u('uBloomK'), 0.08);
  quad();
  gl.bindVertexArray(null);
}

// ------------------------------------------------------------------ timeline (log-scaled)
const T0 = -0.0004, KLOG = 9;
function tEndNow() { return sim && sim.tEnd ? sim.tEnd : 1; }
function tOfU(u) { return T0 + (tEndNow() - T0) * (Math.exp(KLOG * u) - 1) / (Math.exp(KLOG) - 1); }
function uOfT(t) { return Math.log(1 + (t - T0) / (tEndNow() - T0) * (Math.exp(KLOG) - 1)) / KLOG; }
function fmtT(t) { const ms = t * 1000; const sgn = ms < 0 ? '−' : '+'; const a = Math.abs(ms); return sgn + (a < 10 ? a.toFixed(3) : a < 100 ? a.toFixed(2) : a.toFixed(1)) + ' ms'; }
function buildTicks() {
  const tk = $('ticks'); tk.innerHTML = '';
  [0, 0.001, 0.01, 0.1, 0.5, 1, 2].forEach(t => { if (t > tEndNow()) return; const s = document.createElement('span'); s.style.left = (uOfT(t) * 100) + '%'; s.textContent = t === 0 ? '0' : t < 0.1 ? (t * 1000) + ' ms' : (t * 1000) + ' ms'; tk.appendChild(s); });
  const mk = $('marks'); mk.innerHTML = '';
  const marks = [[0, 'Bullet enters'], [sim.bullet.tx, 'Bullet exits'], [sim.memInfo.tStatic, 'Rubber fully retracted'], [sim.tFall, 'Water reaches the floor']];
  marks.forEach(([t, lab]) => { if (t > tEndNow()) return; const i = document.createElement('i'); i.style.left = (uOfT(t) * 100) + '%'; i.title = lab + ' · ' + fmtT(t); mk.appendChild(i); });
}
function phaseLabel(t) {
  if (!sim || !sim.bullet) return '';
  const b = sim.bullet;
  if (t < 0) return 'Bullet approaching';
  if (t < b.tx) return 'Bullet inside the water · cavity forming';
  if (t < b.tx + 0.0008) return 'Exit · jet and mist plume';
  if (t < sim.memInfo.tStatic) return 'Rubber tearing and peeling back';
  if (t < sim.tFall * 0.9) return 'Free water ball · falling and deforming';
  if (t < sim.tFall + 0.06) return 'Impact with the floor';
  return 'Splash and spread';
}

// ------------------------------------------------------------------ UI
const CONTROLS = [
  ['Shot'],
  { id: 'caliber', label: 'Cartridge', type: 'select', opts: Object.entries(CAL).map(([k, v]) => [k, v.name]), rebake: true },
  { id: 'speed', label: 'Bullet speed', min: 80, max: 1000, step: 5, unit: 'm/s', rebake: true },
  { id: 'offset', label: 'Impact height', min: -0.55, max: 0.55, step: 0.01, fmt: v => (v >= 0 ? '+' : '') + Math.round(v * 100) + '% R', rebake: true },
  ['Balloon'],
  { id: 'radius', label: 'Balloon radius', min: 4, max: 12, step: 0.1, unit: 'cm', rebake: true },
  { id: 'height', label: 'Hanging height', min: 0.35, max: 2.0, step: 0.05, unit: 'm', rebake: true },
  { id: 'tension', label: 'Rubber tear speed', min: 12, max: 90, step: 1, unit: 'm/s', rebake: true },
  { id: 'color', label: 'Rubber colour', type: 'select', opts: [['red', 'Red latex'], ['blue', 'Blue latex'], ['green', 'Green latex'], ['yellow', 'Yellow latex'], ['clear', 'Clear latex']] },
  ['Physics'],
  { id: 'gravity', label: 'Gravity', min: 0, max: 25, step: 0.01, unit: 'm/s²', rebake: true },
  { id: 'coupling', label: 'Energy into cavity', min: 0.1, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%', rebake: true },
  { id: 'viscosity', label: 'Water viscosity (XSPH)', min: 0, max: 1, step: 0.01, fmt: v => v.toFixed(2), rebake: true },
  { id: 'air', label: 'Air density', min: 0, max: 3, step: 0.05, fmt: v => (v * 1.2).toFixed(2) + ' kg/m³', rebake: true },
  { id: 'spray', label: 'Spray droplets', min: 0, max: 1.5, step: 0.05, fmt: v => Math.round(v * 100) + '%', rebake: true },
  { id: 'mist', label: 'Mist', min: 0, max: 2, step: 0.05, fmt: v => Math.round(v * 100) + '%', rebake: true },
  ['Lighting'],
  { id: 'env', label: 'Environment', type: 'select', opts: [['studio', 'Studio · softbox'], ['day', 'Daylight · sun']] },
  { id: 'keyI', label: 'Key light', min: 0, max: 10, step: 0.1, fmt: v => v.toFixed(1) },
  { id: 'keyAz', label: 'Key azimuth', min: -180, max: 180, step: 1, unit: '°' },
  { id: 'keyEl', label: 'Key elevation', min: 5, max: 88, step: 1, unit: '°' },
  { id: 'fill', label: 'Fill / ambient', min: 0, max: 3, step: 0.05, fmt: v => v.toFixed(2) },
  { id: 'rim', label: 'Rim strip light', min: 0, max: 4, step: 0.05, fmt: v => v.toFixed(2) },
  { id: 'exposure', label: 'Exposure', min: -3, max: 3, step: 0.1, fmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' EV' },
  ['Camera'],
  { id: 'fstop', label: 'Aperture', min: 1.4, max: 32, step: 0.1, fmt: v => 'f/' + v.toFixed(1) },
  { id: 'shutter', label: 'Shutter', min: 2000, max: 1000000, step: 1000, fmt: v => '1/' + Math.round(v).toLocaleString('en-US') + ' s', log: true },
  { id: 'fov', label: 'Field of view', min: 12, max: 70, step: 1, unit: '°' },
  ['Quality'],
  { id: 'quality', label: 'Water particles', type: 'select', opts: [['low', 'Low · 3.5k'], ['medium', 'Medium · 7k'], ['high', 'High · 12k']], rebake: true },
  { id: 'scale', label: 'Render scale', min: 0.35, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + '%' }
];
let rebakeTimer = 0;
function buildPanel() {
  const panel = $('panel'); panel.innerHTML = '';
  for (const c of CONTROLS) {
    if (Array.isArray(c)) { const h = document.createElement('h2'); h.textContent = c[0]; panel.appendChild(h); continue; }
    const row = document.createElement('div'); row.className = 'row' + (c.rebake ? ' rebake' : '');
    const lab = document.createElement('label'); lab.htmlFor = 'c_' + c.id; lab.textContent = c.label; row.appendChild(lab);
    const out = document.createElement('output'); row.appendChild(out);
    let inp;
    if (c.type === 'select') {
      inp = document.createElement('select'); c.opts.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; inp.appendChild(o); }); inp.value = S[c.id];
      inp.addEventListener('change', () => { S[c.id] = inp.value; if (c.id === 'caliber') { S.speed = CAL[inp.value].v; syncPanel(); } dirty = true; if (c.rebake) scheduleRebake(0); });
    } else {
      inp = document.createElement('input'); inp.type = 'range';
      if (c.log) { inp.min = 0; inp.max = 1000; inp.step = 1; inp.value = Math.round(1000 * Math.log(S[c.id] / c.min) / Math.log(c.max / c.min)); }
      else { inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = S[c.id]; }
      const read = () => c.log ? c.min * Math.pow(c.max / c.min, inp.value / 1000) : parseFloat(inp.value);
      inp.addEventListener('input', () => { S[c.id] = read(); out.textContent = fmtCtl(c, S[c.id]); dirty = true; if (c.rebake) updateShotLine(); });
      inp.addEventListener('change', () => { if (c.rebake) scheduleRebake(150); });
    }
    inp.id = 'c_' + c.id; c.inp = inp; c.out = out; row.appendChild(inp);
    out.textContent = c.type === 'select' ? '' : fmtCtl(c, S[c.id]);
    panel.appendChild(row);
  }
  const note = document.createElement('p'); note.className = 'note';
  note.textContent = 'Settings marked ↻ re-run the physics. Lighting and camera settings apply instantly, even while paused. Drag the view to orbit, scroll or pinch to zoom, right-drag or two-finger drag to pan.';
  panel.appendChild(note);
}
function fmtCtl(c, v) { return c.fmt ? c.fmt(v) : (Math.abs(v) >= 100 ? Math.round(v) : +v.toFixed(2)) + ' ' + (c.unit || ''); }
function syncPanel() { for (const c of CONTROLS) { if (Array.isArray(c) || !c.inp) continue; if (c.type === 'select') c.inp.value = S[c.id]; else if (c.log) c.inp.value = Math.round(1000 * Math.log(S[c.id] / c.min) / Math.log(c.max / c.min)); else c.inp.value = S[c.id]; if (c.type !== 'select') c.out.textContent = fmtCtl(c, S[c.id]); } }
function scheduleRebake(ms) { clearTimeout(rebakeTimer); rebakeTimer = setTimeout(startSim, ms); }
function updateShotLine() { $('shotline').textContent = CAL[S.caliber].name + ' · ' + Math.round(S.speed) + ' m/s · ' + (S.radius * 2).toFixed(0) + ' cm balloon · g = ' + S.gravity.toFixed(2) + ' m/s²'; }

function updateHud() {
  $('rT').textContent = fmtT(S.t); $('tread').textContent = fmtT(S.t);
  if (sim && sim.bullet) {
    $('rU').textContent = Math.round(bulletU(S.t)) + ' m/s';
    const b = sim.bullet; let E = 0;
    if (S.t > 0) { const U = bulletU(Math.min(S.t, b.tx)); E = 0.5 * CAL[S.caliber].mass * (b.U0 * b.U0 - U * U); }
    $('rE').textContent = E.toFixed(0) + ' J';
    const fp = framePair(S.t); $('rV').textContent = fp ? (sim.frames[fp.b].vmax || 0).toFixed(1) + ' m/s' : '—';
    $('phase').textContent = phaseLabel(S.t);
    if (!tlDragging) $('timeline').value = Math.round(uOfT(S.t) * 10000);
  }
}

// transport
let tlDragging = false;
$('timeline').addEventListener('input', (e) => { tlDragging = true; S.t = tOfU(e.target.value / 10000); dirty = true; });
$('timeline').addEventListener('change', () => { tlDragging = false; });
function setPlaying(v) { S.playing = v; $('playIcon').innerHTML = v ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>'; }
$('play').addEventListener('click', () => { if (!S.playing && sim && S.t >= tEndNow() - 1e-6) S.t = T0; setPlaying(!S.playing); });
function stepFrame(d) { if (!sim || !sim.frames.length) return; setPlaying(false); const fp = framePair(S.t); let i = d > 0 ? (fp.m > 0.001 ? fp.b : fp.a + 1) : (fp.m > 0.001 ? fp.a : fp.a - 1); i = clamp(i, 0, sim.frames.length - 1); S.t = sim.frames[i].t; dirty = true; }
$('back').addEventListener('click', () => stepFrame(-1)); $('fwd').addEventListener('click', () => stepFrame(1));
$('speed').addEventListener('change', (e) => { S.speedMode = e.target.value; });
$('panelToggle').addEventListener('click', () => document.body.classList.toggle('panel-open'));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowRight') stepFrame(1); else if (e.code === 'ArrowLeft') stepFrame(-1);
});

// orbit / zoom / pan
const pointers = new Map(); let pinch0 = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey }); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; } });
canvas.addEventListener('pointerup', (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = null; });
canvas.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); pinch0 = null; });
function pan(dx, dy) { const cb = camBasis(); const s = cam.dist * 0.0012; cam.target = [cam.target[0] - cb.right[0] * dx * s + cb.up[0] * dy * s, Math.max(0.01, cam.target[1] - cb.right[1] * dx * s + cb.up[1] * dy * s), cam.target[2] - cb.right[2] * dx * s + cb.up[2] * dy * s]; }
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2 && pinch0) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); cam.dist = clamp(pinch0.dist * pinch0.d / Math.max(d, 1), 0.12, 8); const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; pan(mx - pinch0.mx, my - pinch0.my); pinch0.mx = mx; pinch0.my = my; }
  else if (p.b === 2 || p.shift) pan(dx, dy);
  else { cam.yaw -= dx * 0.006; cam.pitch = clamp(cam.pitch + dy * 0.005, -0.25, 1.5); }
  dirty = true;
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 0.12, 8); dirty = true; }, { passive: false });
canvas.addEventListener('dblclick', () => setView('three'));

// ------------------------------------------------------------------ main loop
let lastNow = performance.now(), holdEnd = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (S.playing && sim && sim.ready && sim.frames.length > 1) {
    const avail = sim.frames[sim.frames.length - 1].t;
    let nt;
    if (S.speedMode === 'ramp') nt = tOfU(Math.min(1, uOfT(S.t) + dt / 16)); else nt = S.t + dt * parseFloat(S.speedMode);
    if (nt > avail) nt = avail;
    if (S.t >= tEndNow() - 1e-7) { holdEnd += dt; if (holdEnd > 1.5) { S.t = T0; holdEnd = 0; } }
    else S.t = Math.min(nt, tEndNow());
    dirty = true;
  }
  if (dirty && !window.__balloon.hold) { render(); updateHud(); dirty = false; }
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { dirty = true; });

buildPanel(); setPlaying(true); startSim(); setView('three'); requestAnimationFrame(loop);

// Hooks for automated screenshots / QA
window.__balloon = {
  S, cam, setView, render: () => { render(); updateHud(); },
  setTime(ms) { S.t = ms / 1000; setPlaying(false); dirty = true; render(); updateHud(); },
  bakedMs: () => (sim && sim.frames.length ? sim.frames[sim.frames.length - 1].t * 1000 : -1),
  done: () => !!(sim && sim.done), info: () => sim && { N: sim.N, S: sim.S, tEnd: sim.tEnd, tx: sim.bullet && sim.bullet.tx, tFall: sim.tFall, frames: sim.frames.length },
  set(id, v) { S[id] = v; syncPanel(); dirty = true; const c = CONTROLS.find(c => c.id === id); if (c && c.rebake) startSim(); }
};
})();
</script>
</body>
